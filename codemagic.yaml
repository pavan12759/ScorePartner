
workflows:
  scorepartner-ios-preview:
    name: ScorePartner iOS Simulator Preview
    instance_type: mac_mini_m2
    max_build_duration: 60

    working_directory: frontend

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Check Flutter project
        script: |
          pwd
          ls
          test -f pubspec.yaml

      - name: Get Flutter packages
        script: flutter pub get

      - name: Build iOS Simulator app
        script: flutter build ios --simulator --debug --no-codesign

      - name: Package simulator app
        script: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphonesimulator/Runner.app \
            build/ScorePartner-ios-simulator.zip

    artifacts:
      - frontend/build/ScorePartner-ios-simulator.zip

name: scorepatner
description: "ScorePartner - Cricket scoring, tournaments, player profiles, and reels for gully, street, village, and local league cricket."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # State Management
  provider: ^6.1.2
  
  # UI Components
  shimmer: ^3.0.0
  lottie: ^3.5.1
  flutter_screenutil: ^5.9.3
  
  # Text to Speech for AI Commentary
  flutter_tts: ^4.0.0
  
  # Network & HTTP
  http: ^1.1.0
  dio: ^5.3.2
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Permissions
  permission_handler: ^13.0.1
  
  # Utils
  intl: ^0.20.3
  uuid: ^4.2.1
  url_launcher: ^6.2.1
  
  # Navigation
  go_router: ^17.5.0

  # Firebase
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  google_sign_in: ^7.2.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  
  # Real-time Socket.io
  socket_io_client: ^3.1.6
  share_plus: ^13.3.0
  path_provider: ^2.1.5
  screenshot: ^3.0.0
  image_picker: ^1.2.1
  image_picker_for_web: ^3.1.1
  record: ^7.1.1
  audioplayers: ^6.0.0
  firebase_messaging: ^16.5.0
  timeago: ^3.7.1
  google_fonts: ^8.0.2
  app_links: ^7.0.0
  image_cropper: ^12.2.1
  google_maps_flutter: ^2.17.1
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  agora_rtc_engine: ^6.3.2
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FDE4D4"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
